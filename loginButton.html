<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="LoginButton.css">
    </head>
    <body>
  <!-- Auth Container -->
  <main class="auth-container">
    <div class="auth-wrapper">
      
      <!-- Left Side -->
      <div class="auth-left">
        <h1>Welcome!</h1>
        <h2>Global Scholarship Programme</h2>
       
         <a href="home.html"><button class="btn-learn">Learn More</button> </a>
      </div>

      <!-- Right Side -->
      <div class="auth-card">
        <div class="auth-header">
          <h2>Sign In</h2>
          <p>Access your account</p>
        </div>

        <div class="alert alert-error" id="error-alert"></div>
        <div class="alert alert-success" id="success-alert"></div>

        <!-- Login Form -->
        <form class="auth-form active" id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" class="form-control" id="login-email" placeholder="Enter your email" required>
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
            </div>
            <small class="form-text">
              <a href="#" id="forgot-password">Forgot password?</a>
            </small>
          </div>

          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember-me">
            <label class="form-check-label" for="remember-me">Remember me</label>
          </div>

          <button type="submit" class="btn-auth">Sign In</button>

          
        </form>
      </div>
    </div>
  </main>
  <script src="LoginButton.js"></script>
  </body>
</html>
